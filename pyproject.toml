[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-cost-tracker"
version = "0.5.0"
description = "Measure execution costs: trade slippage and fees, and on-chain FX quotes against reference mids."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies for the deployed app (Vercel installs these).
# Each is imported only where needed: web3 in chain.py, fastapi in api.py,
# turso_serverless in storage.connect() when TURSO_DATABASE_URL is set,
# pyyaml in registry.py.
dependencies = [
    "fastapi>=0.115",
    "web3>=6",
    "turso_serverless",
    "pyyaml>=6",
    "tzdata",  # time-zone rules for zoneinfo (market_hours.py) on hosts without a system tz database
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx", "uvicorn"]

[project.scripts]
fxtracker = "execution_cost_tracker.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
execution_cost_tracker = ["abis/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
